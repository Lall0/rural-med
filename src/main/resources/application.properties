server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ruralmed?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# O Flyway cria o esquema; datas e prazos sao persistidos em UTC.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE_UTC

spring.jpa.show-sql=false

spring.jackson.serialization.fail-on-empty-beans=false

spring.mvc.format.date=iso
